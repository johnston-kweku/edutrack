{% extends 'base.html' %}
{% load static %}
{% block content %}
    <div class="max-w-11/12 sm:w-9/12 md:w-7/12 lg:w-5/12 flex mt-6 sm:mt-12 flex-col gap-4 items-center justify-center h-6/12 mx-auto">
        <span class="w-full px-4 flex flex-col gap-2 items-center justify-center">
            <span class="bg-blue-600 p-2 rounded-xl">
                <svg class="w-8 h-8 stroke-white stroke-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
                </svg>
            </span>

            <p class="text-3xl text-blue-700 font-bold">
                EduTrack
            </p>
            <p class="text-xs text-gray-500 font-light">
                Ghana Basic School Management
            </p>

        </span>

        <!-- Login Form -->
        <form method="post" autocomplete="off" class="w-full sm:w-8/12 px-6 bg-white flex flex-col gap-3 border border-gray-200 py-8  rounded-lg shadow-lg">
            {% csrf_token %}
            <span class="flex flex-col gap-2 w-full text-left">
                <p class="text-sm font-bold text-gray-800">
                    Welcome Back
                </p>
                <p class="text-[10px] text-gray-500">
                    Please enter your credentials to access the portal
                </p>
            </span>

            <!-- Username -->
            <span class="w-full flex flex-col gap-1 text-left">
                <label for="username" class="text-xs font-bold text-gray-700">Username</label>
                <input type="text" required name="username" autocomplete="off" placeholder="eg. Samuel" class="w-full px-3 py-1 placeholder:text-xs placeholder:font-bold rounded-lg text-gray-400 font-bold bg-blue-50 border border-gray-200 focus:outline-1 outline-blue-600">
            </span>

            <!-- Password -->
            <span class="w-full flex flex-col gap-1 text-left">
                <span class="flex items-center justify-between">
                    <label for="password" class="text-xs font-bold text-gray-700">Password</label>
                    <a href="#" class="text-blue-600 cursor-pointer text-xs">Forgot?</a>
                </span>
                <input type="password" required autocomplete="off" name="password" placeholder="************" class="w-full px-2 py-1 placeholder:text-xs placeholder:font-bold rounded-lg bg-blue-50 border border-gray-200 focus:outline-1 outline-blue-600">
            </span>

            <button id="login-btn" type="submit" class="text-white bg-blue-600 text-center flex items-center justify-center py-2 cursor-pointer rounded-lg w-full text-sm font-bold">
                Login
            </button>

            <hr class="mt-2 border border-gray-300">

            <span class="flex gap-1 items-center text-xs w-full justify-center">
                <p>
                    New to EduTrack?
                </p>
                <a href="#" class="text-blue-600 ">Contact Administrator</a>
            </span>
        </form>
    </div>

    <script src="{% static 'js/accounts/login.js' %}"></script>
{% endblock content %}
