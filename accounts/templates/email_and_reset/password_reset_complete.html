{% extends 'base.html' %}
{% load static %}
{% block content %}
    <div class="max-w-11/12 sm:w-9/12 md:w-7/12 lg:w-5/12 flex mt-6 sm:mt-12 flex-col gap-4 items-center justify-center h-6/12 mx-auto">
        <span class="w-full px-4 flex flex-col gap-2 items-center justify-center">
            <span class="bg-green-600 p-2 rounded-xl">
                <svg class="w-8 h-8 stroke-white stroke-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
            </span>

            <p class="text-3xl text-blue-700 font-bold">
                EduTrack
            </p>
        </span>

        <div class="w-full sm:w-8/12 px-6 bg-white flex flex-col gap-3 border border-gray-200 py-8 rounded-lg shadow-lg text-center">
            <p class="text-sm font-bold text-gray-800">
                Password reset successful
            </p>
            <p class="text-[10px] text-gray-500">
                You can now log in with your new password.
            </p>

            <a href="{% url 'accounts:login' %}" class="mt-2 text-white bg-blue-600 text-center flex items-center justify-center py-2 cursor-pointer rounded-lg w-full text-sm font-bold">
                Go to Login
            </a>
        </div>
    </div>
{% endblock content %}
