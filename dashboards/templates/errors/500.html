{% extends 'base.html' %}

{% block title %}Server error{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50/50 px-4 py-12 sm:px-6 lg:px-8">
    <div class="mx-auto flex max-w-3xl flex-col items-center rounded-3xl border border-gray-200 bg-white p-8 text-center shadow-sm sm:p-12">
        <div class="mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-red-50 text-red-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 6.75h.01M5.4 19.2a9 9 0 1113.2 0L12 4.8l-6.6 14.4z" />
            </svg>
        </div>

        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-red-600">500</p>
        <h1 class="mt-3 text-3xl font-black text-gray-900">Something went wrong</h1>
        <p class="mt-4 max-w-2xl text-sm leading-6 text-gray-600 sm:text-base">
            An unexpected server error occurred. Our team has been notified and you can try again shortly or return to the home page.
        </p>

        <div class="mt-8 flex flex-col gap-3 sm:flex-row">
            <a href="{% url 'accounts:landing' %}" class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-100 transition-all hover:bg-blue-700">
                Go to home
            </a>
            <a href="javascript:history.back()" class="inline-flex items-center justify-center rounded-xl border border-gray-200 bg-white px-5 py-2.5 text-sm font-semibold text-gray-700 transition-all hover:bg-gray-50">
                Go back
            </a>
        </div>
    </div>
</div>
{% endblock %}
